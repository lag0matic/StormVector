[package]
name = "stormvector"
version = "1.3.4"
description = "StormVector weather workstation"
authors = ["lag0matic"]
license = "GPL-3.0-only"
repository = "https://github.com/lag0matic/StormVector"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "stormvector_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rodio = "0.20"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
gdk = "0.18.2"
gtk = "0.18.2"
webkit2gtk = "2.0.2"
